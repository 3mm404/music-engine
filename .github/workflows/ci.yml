name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build ./cmd/agent
      - name: Measure PCM routing and allocations
        run: go test -run '^$' -bench '^BenchmarkRoutePCM$' -benchmem -count=3 ./internal/audio/mixer
